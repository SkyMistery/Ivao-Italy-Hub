name: build-test

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so that a tag can never ship something that was never built or tested.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CI: 'true'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Restore .NET dependencies
        run: dotnet restore IvaoHub.sln

      - name: Build .NET
        run: dotnet build IvaoHub.sln --configuration Release --no-restore

      # Docker is available on the GitHub runners, so the Testcontainers based integration tests
      # run in the same step as the unit tests.
      - name: Test .NET
        run: dotnet test --solution IvaoHub.sln --configuration Release --no-build

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Lint web
        run: pnpm lint
        working-directory: web

      - name: Check web formatting
        run: pnpm format:check
        working-directory: web

      - name: Typecheck web
        run: pnpm typecheck
        working-directory: web

      - name: Test web
        run: pnpm test
        working-directory: web

      - name: Check language files
        run: pnpm i18n:check
        working-directory: web

      - name: Build web
        run: pnpm build
        working-directory: web

      # The generated route tree is committed; a stale one has to fail the build, not surprise the
      # next developer.
      - name: Fail on uncommitted generated files
        run: git diff --exit-code

      - name: Publish self-contained package
        run: >
          dotnet publish src/IvaoHub.Web
          --configuration Release
          --runtime linux-x64
          --self-contained
          --output artifacts/publish

      - name: Check that the SPA is inside the package
        run: test -f artifacts/publish/wwwroot/index.html

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: publish
          path: artifacts/publish
          retention-days: 7
