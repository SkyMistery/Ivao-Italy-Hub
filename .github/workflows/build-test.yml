name: build-test

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so that a tag can never ship something that was never built or tested.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CI: 'true'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Restore .NET dependencies
        run: dotnet restore IvaoHub.sln

      - name: Build .NET
        run: dotnet build IvaoHub.sln --configuration Release --no-restore

      # Docker is available on the GitHub runners, so the Testcontainers based integration tests
      # run in the same step as the unit tests.
      - name: Test .NET
        run: dotnet test --solution IvaoHub.sln --configuration Release --no-build

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      # The typed client is generated from the OpenAPI document the .NET build wrote. It is
      # committed, so a contract that moved on the server and a client that did not notice show up
      # as a diff in the step below rather than as a runtime surprise.
      - name: Generate the typed API client
        run: pnpm gen:api
        working-directory: web

      - name: Lint web
        run: pnpm lint
        working-directory: web

      - name: Check web formatting
        run: pnpm format:check
        working-directory: web

      - name: Typecheck web
        run: pnpm typecheck
        working-directory: web

      - name: Test web
        run: pnpm test
        working-directory: web

      # A module keeps its own words next to its own code and they are copied into locales/, which
      # is the one set of language files the SPA, the back end and the check below all read. The
      # copies are committed for the same reason the API client is: a `dotnet run` with no pnpm in
      # sight still has to find every language file.
      - name: Sync the language files of the modules
        run: pnpm i18n:sync
        working-directory: web

      - name: Check language files
        run: pnpm i18n:check
        working-directory: web

      - name: Build web
        run: pnpm build
        working-directory: web

      # The generated route tree, the generated API client and the copied module language files are
      # all committed; a stale one has to fail the build, not surprise the next developer.
      - name: Fail on uncommitted generated files
        run: git diff --exit-code

      - name: Publish self-contained package
        run: >
          dotnet publish src/IvaoHub.Web
          --configuration Release
          --runtime linux-x64
          --self-contained
          --output artifacts/publish

      - name: Check that the SPA is inside the package
        run: test -f artifacts/publish/wwwroot/index.html

      # What an installation needs and no compiler produces: the language files the back end reads,
      # the templates a fresh installation starts with, the example configuration to copy, and the
      # licence that Apache-2.0 section 4(d) wants travelling with every redistribution.
      - name: Check that the package carries locales, seeds, examples and the licence
        run: |
          test -f artifacts/publish/locales/en/errors.json
          test -f artifacts/publish/locales/it/errors.json
          test -f artifacts/publish/seed/content-templates/section-page.json
          test -f artifacts/publish/config/division.example.json
          test -f artifacts/publish/config/ivao-oauth.example.json
          test -f artifacts/publish/LICENSE
          test -f artifacts/publish/NOTICE

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: publish
          path: artifacts/publish
          retention-days: 7
