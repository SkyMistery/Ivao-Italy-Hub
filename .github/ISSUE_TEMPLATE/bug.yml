name: Bug
description: Something on the hub does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per bug. **A security weakness that can be exploited does not go here** (this repository is public): report it privately (Security → Report a vulnerability) or to the maintainer. A hardening with no attack (a header, a limit) is an ordinary issue with the `security` label.
  - type: input
    id: where
    attributes:
      label: Where
      description: The address of the page, or the screen and the action.
      placeholder: https://test.example.org/staff/events/12/atc
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: As whom
      description: The bug often depends on who looks.
      options:
        - visitor (not signed in)
        - member
        - staff of a department, or a member with a grant
        - FIR team
        - superadmin
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, one step per line, so that someone else can do it again.
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The message, the wrong value, the page that did not open. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version and commit at the bottom of the page (for example 0.9.2 · 4363c40).
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How bad
      options:
        - "blocker: a whole flow cannot be done, or data is lost"
        - "major: a function is wrong and there is no way around it"
        - "minor: everything else"
    validations:
      required: true
